[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-engine"
version = "0.1.0"
description = "Austrian Tax Engine for E-Trade RSUs and ESPP using Moving Average Cost Basis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["tax", "austria", "espp", "rsu", "capital-gains", "kest"]
dependencies = [
    "certifi>=2026.10.19",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.10",
    "playwright>=1.64.0",
    # Used directly to merge the bundle PDFs (also a pdfplumber dependency)
    "pypdfium2>=5.14.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-requests>=2.33.0.20261006",
]

[project.scripts]
# CLI entry points (installed as global commands)
tax-engine = "tax_engine.cli_main:main"
tax-demo = "tax_engine.cli_demo:main"
tax-login = "tax_engine.etrade_login:login"
tax-download = "tax_engine.download_all:main"
tax-download-espp = "tax_engine.etrade_download_espp:main"
tax-download-orders = "tax_engine.etrade_download_orders:main"
tax-download-rsu = "tax_engine.etrade_download_rsu:main"
tax-download-options = "tax_engine.etrade_download_options:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]  # Module level import not at top (sys.path manipulation)
"demo.py" = ["E402"]  # Module level import not at top (sys.path manipulation)

[tool.ruff.lint.isort]
known-first-party = ["tax_engine"]

[tool.mypy]
# python_version is intentionally unset: mypy then targets the interpreter it
# runs under, and CI runs it on every supported version. Pinning it to 3.10
# makes mypy reject newer third-party stubs that use 3.12-only syntax.
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "openpyxl.*",
    "playwright.*",
    "pypdfium2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tax_engine.etrade_login"
# Playwright's new_context has complex overloaded types that don't work well with **kwargs
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "tests.*"
# Tests don't need strict typing - focus on runtime correctness
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["arg-type", "union-attr", "type-arg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
# Tests must never reach the ECB API; an on-demand FX fetch is a test bug.
filterwarnings = ["error::tax_engine.models.LazyFxRateWarning"]
